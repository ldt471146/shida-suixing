name: Build signed release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The keystore never lives in the repository; it arrives base64-encoded from a secret and
      # is written to the runner's temp directory for the duration of this job only.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is not set; refusing to build an unsigned release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Write local.properties
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VISION_BASE_URL: ${{ vars.VISION_BASE_URL }}
          VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
        run: |
          {
            echo "signing.storeFile=$RUNNER_TEMP/release.jks"
            echo "signing.storePassword=$STORE_PASSWORD"
            echo "signing.keyAlias=$KEY_ALIAS"
            echo "signing.keyPassword=$KEY_PASSWORD"
            if [ -n "$VISION_BASE_URL" ]; then echo "vision.baseUrl=$VISION_BASE_URL"; fi
            if [ -n "$VISION_API_KEY" ]; then echo "vision.apiKey=$VISION_API_KEY"; fi
          } > local.properties

      # Windows checkouts do not carry the executable bit, so the wrapper arrives non-executable
      # on the runner even when the index mode is set correctly.
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      # The embedded school page is driven by a JavaScript asset that no Gradle task covers, so it is
      # checked here instead. It was written long ago but nothing ran it, which is how a bridge that
      # silently filled nothing shipped: without this step the suite is documentation, not a gate.
      - name: Check the official-page bridge
        run: node --test scripts/test-portal-bridge.cjs

      - name: Test, lint and assemble
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --console=plain

      # The updater compares versionCode, which the APK cannot report without being installed,
      # so the release carries it alongside the artifact.
      # Asset names stay ASCII: the release step mangles non-ASCII characters in the runner shell.
      - name: Collect version metadata
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          printf '{"versionCode":%s,"versionName":"%s"}\n' "$VERSION_CODE" "$VERSION_NAME" > version.json
          cp app/build/outputs/apk/release/app-release.apk "shida-suixing-${VERSION_NAME}.apk"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "师大随行 ${GITHUB_REF_NAME}" \
            --generate-notes \
            version.json \
            "shida-suixing-${VERSION_NAME}.apk"
